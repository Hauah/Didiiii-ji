
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Little Locker 🎀</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Trebuchet MS', sans-serif;
    background: linear-gradient(135deg, #ffe0ec, #e8dcff);
}

.locker {
    width: 340px;
    padding: 35px 25px;
    background: rgba(255,255,255,0.75);
    border: 2px solid white;
    border-radius: 30px;
    box-shadow: 0 15px 40px #d69bbd55;
    text-align: center;
}

.bow {
    font-size: 45px;
    margin-bottom: 10px;
}

h1 {
    color: #d66b9b;
    font-size: 25px;
    margin-bottom: 8px;
}

p {
    color: #a77b9b;
    font-size: 13px;
    margin-bottom: 25px;
}

.pin-display {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 25px;
}

.dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #f4c8df;
    border: 2px solid #e99abd;
}

.dot.filled {
    background: #d66b9b;
}

.keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.key {
    height: 55px;
    border: none;
    border-radius: 16px;
    background: #fff0f7;
    color: #bd6892;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 #edc0d8;
    transition: 0.2s;
}

.key:hover {
    background: #ffd9eb;
    transform: translateY(-2px);
}

.key:active {
    transform: translateY(3px);
    box-shadow: none;
}

.submit {
    width: 100%;
    margin-top: 22px;
    padding: 15px;
    border: none;
    border-radius: 18px;
    background: #e98bb7;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 0 #cf6d9d;
}

.submit:hover {
    background: #dc75a7;
}

.message {
    margin-top: 18px;
    font-size: 13px;
    color: #d45d8d;
    min-height: 18px;
}

.footer {
    margin-top: 22px;
    color: #c58eae;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="locker">
    <div class="bow">🎀</div>
    <h1>♡ Enter 4-digit PIN ♡</h1>
    <p>HINT: Kisi ki DOB (EG: 2906)</p>

    <div class="pin-display">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <div class="keypad">
        <button class="key" onclick="addDigit('1')">1</button>
        <button class="key" onclick="addDigit('2')">2</button>
        <button class="key" onclick="addDigit('3')">3</button>
        <button class="key" onclick="addDigit('4')">4</button>
        <button class="key" onclick="addDigit('5')">5</button>
        <button class="key" onclick="addDigit('6')">6</button>
        <button class="key" onclick="addDigit('7')">7</button>
        <button class="key" onclick="addDigit('8')">8</button>
        <button class="key" onclick="addDigit('9')">9</button>
        <button class="key" onclick="clearPin()">C</button>
        <button class="key" onclick="addDigit('0')">0</button>
        <button class="key" onclick="deleteDigit()">⌫</button>
    </div>

    <button class="submit" onclick="checkPin()">
        Unlock ♡
    </button>

    <div class="message" id="message"></div>
</div>

<script>
let pin = "";

function updateDots() {
    document.querySelectorAll(".dot").forEach((dot, i) => {
        dot.classList.toggle("filled", i < pin.length);
    });
}

function addDigit(num) {
    if (pin.length < 4) {
        pin += num;
        updateDots();
        document.getElementById("message").innerText = "";
    }
}

function clearPin() {
    pin = "";
    updateDots();
}

function deleteDigit() {
    pin = pin.slice(0, -1);
    updateDots();
}

function checkPin() {
    const message = document.getElementById("message");

    if (pin === "2505") {
        message.innerText = "Unlocked! Redirecting... ";

        setTimeout(() => {
            window.location.href = "loading.html";
        }, 700);

    } else {
        message.innerText = "Oops! Wrong PIN, try again 🥺";
        pin = "";
        updateDots();
    }
}
</script>

</body>
</html>
